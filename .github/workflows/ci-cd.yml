name: CI/CD Pipeline

on:
  push:
      branches: [main]
  pull_request:
      branches: [main]

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
              node-version: '24'
              cache: 'npm'

        - name: Install Dependencies
          run: npm ci

        - name: Run Prettier Check
          run: npm run prettier:check

  eslint:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
              node-version: '24'
              cache: 'npm'

        - name: Install Dependencies
          run: npm ci

        - name: Run ESLint
          run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
              node-version: '24'
              cache: 'npm'

        - name: Install Dependencies
          run: npm ci

        - name: Run Vitest Tests
          run: npm run test:run

  security-audit:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  build:
    runs-on: ubuntu-latest
    needs: [prettier, eslint, test, security-audit]
    if: |
      always() &&
      (needs.prettier.result == 'success') &&
      (needs.eslint.result == 'success') &&
      (needs.test.result == 'success') &&
      (needs.security-audit.result == 'success' || needs.security-audit.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build (TypeScript + Vite)
        run: npm run build
